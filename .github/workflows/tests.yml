name: tests
on:
  push:
    branches: [main]
  pull_request:
jobs:
  unit-tests:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Install (no GUI / no GPU needed for unit tests)
        run: python -m pip install numpy pandas matplotlib pillow pytest
      - name: Run unit tests
        run: python -m pytest -q tests
